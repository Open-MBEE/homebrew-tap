name: Update opensysml formula

on:
  schedule:
    - cron: '17 * * * *'      # hourly; a release is picked up within the hour
  workflow_dispatch:
    inputs:
      tag:
        description: 'OpenSysML release tag (default: latest release)'
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo Open-MBEE/OpenSysML --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG"

      - name: Render the formula from the release checksums
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The render script and the formula template live in the OpenSysML repo.
          # Fetch both at the released tag so the rendering matches that release.
          curl -fsSL -o /tmp/render.sh \
            "https://raw.githubusercontent.com/Open-MBEE/OpenSysML/${TAG}/scripts/render-homebrew-formula.sh"
          mkdir -p /tmp/src/scripts /tmp/src/packaging/homebrew/Formula
          mv /tmp/render.sh /tmp/src/scripts/render-homebrew-formula.sh
          curl -fsSL -o /tmp/src/packaging/homebrew/Formula/opensysml.rb \
            "https://raw.githubusercontent.com/Open-MBEE/OpenSysML/${TAG}/packaging/homebrew/Formula/opensysml.rb"
          chmod +x /tmp/src/scripts/render-homebrew-formula.sh
          /tmp/src/scripts/render-homebrew-formula.sh "$TAG" > Formula/opensysml.rb
          head -20 Formula/opensysml.rb

      - name: Commit if the formula changed
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/opensysml.rb; then
            echo "Formula already at $TAG; nothing to do."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/opensysml.rb
          git commit -m "opensysml ${TAG}"
          git push
